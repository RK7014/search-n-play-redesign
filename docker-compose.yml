services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: searchnplay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/searchnplay?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        GO_API_URL: http://backend:8080
        SITE_URL: http://localhost:3000
    environment:
      GO_API_URL: http://backend:8080
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
